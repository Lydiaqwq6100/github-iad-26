<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project · Lydia Liu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        @font-face {
            font-family: 'DreamerTM';
            src: url('DreamerTM-Regular copy.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        .font-gothic {
            font-family: 'DreamerTM', serif;
            letter-spacing: -0.02em;
        }

        .font-mono-body {
            font-family: 'Share Tech Mono', monospace;
        }

        .bg-aura {
            background: url('未命名作品 2.png') no-repeat center center fixed;
            background-size: cover;
        }

        .preview-img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 4px;
            background: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-aura text-gray-900 font-mono-body min-h-screen selection:bg-pink-200 antialiased" data-page="project">

    <nav class="fixed top-0 left-0 w-full flex justify-between items-center px-8 md:px-16 py-8 z-50">
        <a href="index.html" class="text-2xl md:text-3xl font-gothic hover:opacity-70 transition duration-200">Lydia Liu</a>
        <a href="index.html#works" class="text-lg md:text-xl font-gothic flex items-center gap-1.5 hover:opacity-70 transition duration-200 border-b border-black pb-1">
            <img src="未命名作品.png" alt="" class="w-5 h-5 object-contain"> Back to works
        </a>
    </nav>

    <main id="project-content" class="max-w-5xl mx-auto px-8 md:px-16 pt-32 pb-24">
        <p id="project-category" class="text-sm tracking-wide text-gray-600 mb-4 font-gothic">Loading…</p>
        <h1 id="project-title" class="text-5xl md:text-6xl font-gothic mb-10">Loading…</h1>

        <div id="project-description" class="space-y-6 text-[15px] leading-relaxed tracking-wide max-w-3xl"></div>
        <p id="project-award" class="mt-6 italic text-gray-700 hidden"></p>

        <div id="project-gallery" class="mt-16 space-y-12"></div>
    </main>

    <main id="project-not-found" class="max-w-5xl mx-auto px-8 md:px-16 pt-32 pb-24 hidden">
        <h1 class="text-4xl font-gothic mb-6">Project not found</h1>
        <p class="text-gray-700 mb-8">This project may not exist yet in Sanity CMS, or the slug in the URL is incorrect.</p>
        <a href="index.html#works" class="underline hover:text-pink-600 transition">Back to works</a>
    </main>

    <script src="js/config.js"></script>
    <script src="js/sanity-client.js"></script>
    <script src="js/project-fallback.js"></script>
    <script src="js/project-page.js"></script>
</body>
</html>
